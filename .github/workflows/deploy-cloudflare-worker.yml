name: Manual Cloudflare Worker Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-nextjs-commerce
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test active Worker bundle
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://taprater.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run cf:build
