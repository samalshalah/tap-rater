name: One-time deploy Multi-Link refactor

on:
  push:
    branches:
      - deploy-multilink-0eb0ed8-run

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-worker-one-time-multilink
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and deploy tap-rater-app-git
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker
      url: https://taprater.com

    env:
      NEXT_PUBLIC_SITE_URL: https://taprater.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare deploy secrets
        shell: bash
        run: |
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Run tests
        run: npm test

      - name: Build Cloudflare Worker bundle
        run: npm run cf:build

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy production Worker
        run: npx wrangler deploy

      - name: Show latest deployment
        run: npx wrangler deployments list --name tap-rater-app-git

      - name: Smoke test production
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://taprater.com/ >/dev/null
          curl --fail --silent --show-error --location --max-time 30 https://taprater.com/multi-link >/dev/null
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 https://taprater.com/product/multi-link-stand)
          case "$code" in
            301|302|307|308) ;;
            *) echo "Expected redirect for retired multi-link product, got HTTP $code"; exit 1 ;;
          esac
